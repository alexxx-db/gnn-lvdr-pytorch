[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnn-patient-recommendations"
version = "2.0.0"
description = "Graph Neural Network Patient Recommendations with Databricks, GraphSAGE, and Agentic AI"
requires-python = ">=3.10"
dependencies = [
    "pyspark>=3.5.0",
    "dgl>=1.1",
    "torch>=2.0",
    "mlflow>=2.14",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "gradio>=4.0",
    "databricks-sdk>=0.20",
    "dbldatagen>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py310"
line-length = 120
